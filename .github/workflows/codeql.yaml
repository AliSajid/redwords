---
name: "CodeQL"

on:
  push:
    branches: ["next"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["next"]
  schedule:
    - cron: "45 5 * * 2"

# Cancel superseded runs of the same ref so a fast-moving branch does not pile
# up redundant analyses.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default token to nothing; each job grants only the scopes it
# needs.
permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: "ubuntu-26.04"
    timeout-minutes: 360
    permissions:
      # The CodeQL action reads the workflow and action metadata to build the
      # analysis.
      actions: read
      contents: read
      # Uploads the SARIF results to the Security tab.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{matrix.language}}"
