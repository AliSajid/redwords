---
name: Cloudflare Preview Deployments

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# Only one preview deploy per branch at a time; a newer dispatch supersedes an
# in-flight one so a fast-moving branch does not queue redundant deploys.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build-and-Test:
    name: Build and Test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # the release step pushes tags
      pull-requests: write # the release step updates the PR status
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Install toolchain via mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      # Each step delegates to a mise task so the command is defined once in
      # mise.toml and runs identically on a developer's machine and in CI.
      - name: Install dependencies
        run: mise run ci-install
      - name: Ensure playwright has the latest browser binaries
        run: mise run ci-playwright
      - name: Ensure project is formatted and linted
        run: mise run ci-lint
      - name: Ensure project syncs the configs
        run: mise run ci-check
      - name: Build
        run: mise run ci-build
      - name: Test
        run: mise run ci-test
      - name: Create a release
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT_GITHUB }}
          GH_TOKEN: ${{ secrets.ACTIONS_PAT_GITHUB }}
        run: mise run ci-release
  Deploy-Preview:
    name: Deploy Preview
    runs-on: ubuntu-26.04
    needs: Build-and-Test
    if: ${{ needs.Build-and-Test.result == 'success' }}
    timeout-minutes: 30
    permissions:
      contents: read # the deploy job only checks out the repository
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy job authenticates to Cloudflare via CLOUDFLARE_API_TOKEN,
          # not git credentials, so the checkout's credentials are not persisted
          # into the runner environment (least-privilege, matches Build-and-Test).
          persist-credentials: "false"
      - name: Install toolchain via mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: mise run ci-install
      - name: Build
        run: mise run ci-build
      - name: Deploy to Cloudflare Pages
        # The branch is passed to the deploy-preview task, which forwards it to
        # wrangler as --branch so the preview is tagged with the source branch.
        run: mise run deploy-preview -- "$DEPLOY_BRANCH"
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
