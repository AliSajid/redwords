name: Cloudflare Production Deployments

on:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT_GITHUB }}

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain via mise
        uses: jdx/mise-action@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure playwright has the latest browser binaries
        run: pnpm exec playwright install --with-deps
      - name: Ensure project is formatted and linted
        run: pnpm run lint
      - name: Ensure project syncs the configs
        run: pnpm run check
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test
      - name: Create a release
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT_GITHUB }}
          GH_TOKEN: ${{ secrets.ACTIONS_PAT_GITHUB }}
        run: pnpm run release
  Deploy-Production:
    runs-on: ubuntu-latest
    needs: Build-and-Test
    if: needs.Build-and-Test.result == 'success'
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7
      - name: Install toolchain via mise
        uses: jdx/mise-action@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy .svelte-kit/cloudflare --project-name=redwords --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
